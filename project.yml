name: TheTap

options:
  deploymentTarget:
    macOS: "26.0"

packages:
  BrewCheck:
    path: Packages/BrewCheck

targets:
  TheTap:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: BrewCheck
        product: BrewCheck
    info:
      path: App/Info.plist
      properties:
        CFBundleName: TheTap
        CFBundleDisplayName: TheTap
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleURLTypes:
          - CFBundleURLName: io.github.muunleit-projects.thetap
            CFBundleURLSchemes:
              - thetap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muunleit-projects.thetap
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
